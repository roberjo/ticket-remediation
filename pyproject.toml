[project]
name = "ticket-remediation"
version = "0.1.0"
description = "ServiceNow -> Jira ingestion and Jira -> GitHub PR remediation pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pygithub>=2.3",
    "anthropic>=0.34",
    "typer>=0.12",
    "google-genai>=2.17.0",
]

[project.optional-dependencies]
mocks = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "faker>=26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_remediation", "mock_servers"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert): pytest's own idiom for assertions, not a runtime safety check.
# S105/S106 (hardcoded password): every hit is a fake credential in a test fixture, never
#   a real one — real credentials only ever come from `.env` (see README Security section).
# S603/S607 (subprocess/partial-path): tests/unit/connectors/test_git_ops.py and
#   tests/unit/remediate/test_context_builder.py invoke the real `git` CLI directly to spin
#   up local bare repos for integration-style tests, not production code paths.
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
# S311 (non-cryptographic random): generates synthetic demo ticket data for the local mock
# server, never anything security-sensitive.
"mock_servers/**" = ["S311"]

[tool.mypy]
python_version = "3.11"
packages = ["ticket_remediation"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not contract'"
markers = [
    "contract: spins up an in-process mock server and hits it over real HTTP",
]
