name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --locked --extra mocks --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Dependency vulnerability scan (advisory — see docs/architecture/08-cross-cutting-and-risks.md)
        run: uv run pip-audit
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    # git_ops tests make real commits; the runner has no git identity configured.
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.11"; prove all three, not just the
        # one version lint/type-check happens to run under.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --extra mocks --group dev

      - name: Unit tests (no network), with coverage
        run: uv run pytest --cov=ticket_remediation --cov-report=term-missing

      - name: Contract tests (in-process mock servers)
        run: uv run pytest -m contract
