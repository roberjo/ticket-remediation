# Jira project/component -> GitHub repo routing rules.
# One route for the v1 slice: AVREM findings against the frontend, backend-api, or
# infra-config (Terraform, under infra/) component of the sample vulnerable app all
# go to that same app's repo, since the Terraform files accompany the app in-repo.
# Fill in `owner` with your real GitHub username/org before running against a real repo.
routes:
  - match:
      project_key: AVREM
      components:
        - frontend
        - backend-api
        - infra-config
    repo:
      owner: roberjo
      name: vulnerable-react-demo-app
      default_branch: main
      # Optional: a shell command run in the repo's own working directory after the LLM's
      # edits are applied, before commit/push/PR. A nonzero exit blocks the PR entirely — see
      # ADR-11 in docs/architecture/02-solution-strategy.md. Left unset here since this demo
      # repo's own lint/test scripts aren't guaranteed stable enough not to false-negative
      # block a remediation; uncomment and adjust once you've confirmed the command is fast
      # and reliable against your target repo.
      # verify_command: "npm run lint && npm test"
